<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Info | Who is awake?</title>

	<script>
		// Runs synchronously, before anything renders, so the page never
		// flashes the wrong theme. Must stay inline here rather than move to
		// an external/deferred file, which would only run after first paint.
		(function () {
			var stored = localStorage.getItem('color-scheme');
			var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
			document.documentElement.classList.toggle('dark', isDark);
		})();
	</script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

	<script src="js/theme.js" defer></script>

	<link rel="stylesheet" href="css/main.comp.css">
	<meta name="color-scheme" content="light dark">
	<!--
		Static fallbacks matched to OS scheme, so iOS Safari has the
		right chrome color at parse time before theme.js runs. theme.js
		keeps these (and itself) in sync for manual overrides.
	-->
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffe4c4">
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f274d">
</head>
<body>
